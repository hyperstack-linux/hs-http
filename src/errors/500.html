<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 Internal Server Error</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }

    .container {
        max-width: 600px;
        padding: 20px;
    }

    h1 {
        font-size: 10rem;
        color: #ff4c4c;
        margin-bottom: 20px;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    h2 {
        font-size: 2rem;
        margin-bottom: 20px;
        color: #ffffff;
    }

    p {
        font-size: 1.2rem;
        margin-bottom: 30px;
        color: #bbbbbb;
    }

    a {
        text-decoration: none;
        color: #ff4c4c;
        border: 2px solid #ff4c4c;
        padding: 10px 20px;
        border-radius: 5px;
        transition: 0.3s;
    }

    a:hover {
        background-color: #ff4c4c;
        color: #121212;
    }

    .version {
        margin-top: 50px;
        font-size: 0.9rem;
        color: #888888;
        opacity: 0.5;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>The server encountered an unexpected condition that prevented it from fulfilling the request.</p>
        <div class="version">hs-http 1.0</div>
    </div>
</body>
</html>
